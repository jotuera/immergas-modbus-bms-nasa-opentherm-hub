# Immergas MAGIS M (Midea M-Thermal) heat pump - example configuration
# One AtomS3 (Lite) + ATOMIC PortABC + 1x M5Stack Isolated RS485 Unit on Port C. The hub is the Modbus master, the
# wired controller (HMI) the slave: RS485 A / B -> controller H1 / H2 (swap them if nothing answers), GND -> E.
# NEVER connect to A / B (the 13.5 V AC supply of the controller) or X / Y. 9600 8N1, address 1.
# Experimental: built from the Midea M-Thermal protocol, not tested on a MAGIS M yet.
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-magis-m
  friendly_name: Immergas Magis M
  mt_name_prefix: "Immergas M"
  mt_uart_rx_pin: GPIO6     # Port C (white wire = RX)
  mt_uart_tx_pin: GPIO5

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret immergas_magis_m_api_key

ota:
  - platform: esphome
    password: !secret immergas_magis_m_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

packages:
  magis_m:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      - packages/lang/mt_en.yaml        # or mt_pl.yaml
      - packages/mt_core.yaml
      - packages/mt_status.yaml
      - packages/mt_sensors.yaml
      - packages/mt_energy.yaml
      - packages/mt_stats.yaml          # optional: energy / COP / compressor starts and runtime today
      - packages/mt_programs.yaml       # optional: CH / DHW programs, vacation, summer / winter (needs mt_stats)
      - packages/mt_unit_params.yaml    # optional: service reminder (needs mt_stats)
      - packages/mt_costs.yaml          # optional: electricity price, heat pump heat cost, last DHW cycle (cards)
      - packages/mt_busmap.yaml         # optional: register scanner for the bus map card
      - packages/mt_control.yaml
      - packages/mt_params.yaml         # optional: installer parameters, read only
