# Immergas TRIO HYDRO HYBRID - example configuration (planned, looking for testers)
# One AtomS3 Lite + ATOMIC PortABC on all three buses of the system:
#   OpenTherm gateway between the TRIO indoor unit (OpenTherm master) and the VICTRIX TERA boiler (terminals 41 / 44)
#   Samsung NASA F1 / F2 (outdoor unit UE HYDRO HP <-> interface board A22) - listening first
#   zone bus (Modbus RTU 9600 8E1, the indoor unit is master, zone panel 41 = 0x29 / 42) - listening first
# Wiring (diagram: docs/trio-hydro.md#hardware-planned):
#   port A -> Grove cable -> Grove 4-pin screw terminal: GND -> Master shield GND + regulator GND, 5V -> regulator IN,
#             white G39 -> D2, yellow G38 -> D1 of the DIYLess Master shield -> boiler 41 / 44 (2 new wires)
#   3.3 V regulator (AMS1117-3.3 module or Pololu D24V5F3): OUT -> 3V3 of both shields (common 3.3 V, common GND)
#   port C -> DIYLess Slave shield: GND, 5V, white G6 -> D6, yellow G5 -> D7 -> the indoor unit's OpenTherm wires
#   port B -> M5Stack Isolated RS485 Unit -> F1 / F2 (RX G8, TX G7)
#   Grove AtomS3 socket (next to USB-C) -> M5Stack Isolated RS485 Unit -> zone bus (RX G1, TX G2), 120 ohm across A-B
# All 8 GPIOs are used, so no ot_3v3_supply here: the regulator gives the shields their 3.3 V.
# Everything starts passive except the OpenTherm gateway (it relays the indoor unit's frames to the boiler):
#   F1 / F2 with f1f2_transmit: "false" (listen only), the zone bus emulation switches OFF (the hub only listens).
# The F1 / F2 and zone bus maps come from MAGIS PRO / COMBO V2 - on TRIO HYDRO they are a hypothesis to check
# (docs/trio-hydro.md, "What a tester would do"). Logs: docs/collecting-logs.md.
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-trio-hydro
  friendly_name: Immergas TRIO HYDRO

  # entity name prefixes: "<prefix> - <name>" (the cards find the entities whatever prefix you choose)
  dd_name_prefix: "Immergas DD"
  f1f2_name_prefix: "Immergas FF - "
  ot_name_prefix: "Immergas OT"

  # zone bus on the Grove AtomS3 socket (white wire = RX)
  dd_uart_rx_pin: GPIO1
  dd_uart_tx_pin: GPIO2
  dd_uart_de_pin: none          # the isolated unit switches the direction itself
  # F1 / F2 on PortABC port B
  f1f2_uart_rx_pin: GPIO8
  f1f2_uart_tx_pin: GPIO7
  f1f2_transmit: "false"        # listen only; "true" later for the FSV values (polls the indoor board)
  # f1f2_indoor_address: "20.00.01"   # check the addresses in the F1 / F2 log first (README "Finding the addresses")
  # OpenTherm: Master shield on port A (boiler), Slave shield on port C (TRIO indoor unit)
  ot_boiler_in_pin: GPIO39      # white -> D2
  ot_boiler_out_pin: GPIO38     # yellow -> D1
  ot_room_in_pin: GPIO6         # white -> D6
  ot_room_out_pin: GPIO5        # yellow -> D7

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # logs over USB, the UARTs stay free for the two RS485 buses

api:
  encryption:
    key: !secret immergas_trio_api_key
  reboot_timeout: 0s   # the OpenTherm gateway must keep relaying while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_trio_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # no Wi-Fi does not restart the ESP: the buses keep running
  ap:

captive_portal:

external_components:
  - source: github://jotuera/immergas-modbus-bms-nasa-opentherm-hub@main
    components: [immergas_core, immergas_climate, f1f2_nasa]

packages:
  trio:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      # languages: every packages/lang/<package>_xx.yaml = cs de en es fr hu it nl pl pt sk
      - packages/lang/dd_en.yaml
      - packages/lang/f1f2_en.yaml
      - packages/lang/ot_en.yaml
      # zone bus (the D+/D- packages of MAGIS: zone panel 0x29 / Dominus 0x33 protocol)
      - packages/dd_core.yaml
      - packages/dd_engine.yaml
      - packages/dd_zone1.yaml
      - packages/dd_zones23.yaml
      - packages/dd_dhw.yaml
      - packages/dd_dominus.yaml
      - packages/dd_schedules.yaml
      - packages/dd_heat_pump.yaml
      - packages/dd_boiler_info.yaml
      - packages/dd_diagnostics.yaml    # bus sniffer: the zone bus log for the map
      # F1 / F2 (read only: no f1f2_control, no f1f2_outing_targets)
      - packages/f1f2_core.yaml
      - packages/f1f2_indoor.yaml
      - packages/f1f2_outdoor.yaml
      - packages/f1f2_info.yaml
      - packages/f1f2_computed.yaml
      - packages/f1f2_diagnostics.yaml  # undecoded PDUs + bus sniffer
      # OpenTherm gateway (indoor unit -> hub -> boiler)
      - packages/ot_core.yaml
      - packages/ot_gateway.yaml
      - packages/ot_sensors.yaml
      - packages/ot_stats.yaml
      - packages/ot_computed.yaml
      - packages/ot_supervision.yaml   # optional: is the CH demand really taken up by the boiler
      - packages/ot_control.yaml        # used only while the indoor unit is silent or with an override switch on
      - packages/ot_boiler_params.yaml  # optional: the VICTRIX TERA menu copied once (codes, hints)

# The isolated RS485 unit switches the direction itself: no DE pin on the zone bus
uart:
  - id: !extend dd_uart
    flow_control_pin: !remove

switch:
  # zone bus emulation starts OFF: the hub only listens to the indoor unit and the zone panel / Dominus
  - id: !extend dd_emulate_33_switch
    restore_mode: RESTORE_DEFAULT_OFF
  - id: !extend dd_emulate_29_switch
    restore_mode: RESTORE_DEFAULT_OFF
