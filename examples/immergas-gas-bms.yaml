# Immergas gas boiler (Modbus BMS) - example configuration
# One AtomS3 Lite + 1x M5Stack Isolated RS485 Unit in its Grove port (no PortABC needed), the hub is the Modbus master and the
# boiler a slave (address 1, 9600 8E1; MAGIS M TOP 8N1 - gb_mtop sets it). For VICTRIX SUPERIOR 2021 / ZEUS Superior 25-35, VICTRIX EXTRA and VICTRIX
# PRO V2 EU - keep ONE model package below. In the BMS mode the boiler has no Dominus, CAR, room thermostat or zone
# panel: Home Assistant (or gb_curve) gives the heat request and the flow setpoint.
#   SUPERIOR / EXTRA: RS485 A/B -> boiler D+ / D-  (jumper X40 stays; EXTRA: P.18 = 2, P.11 = 1)
#   PRO V2 EU:        RS485 A/B -> T+ / T- of A38   (X40 removed, 120 ohm termination TRD - T-)
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-gas-boiler
  friendly_name: Immergas Gas Boiler
  gb_name_prefix: "Immergas Gas"
  gb_uart_rx_pin: GPIO1     # AtomS3 Lite Grove port (white wire = RX); with an ATOMIC PortABC on Port C: GPIO6
  gb_uart_tx_pin: GPIO2     # with an ATOMIC PortABC on Port C: GPIO5

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret immergas_gas_api_key
  reboot_timeout: 0s   # the heat request keep-alive must go on while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_gas_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:

captive_portal:

packages:
  gas:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      - packages/lang/gb_en.yaml        # or _cs _de _es _fr _hu _it _nl _pl _pt _sk
      - packages/gb_core.yaml
      - packages/gb_control.yaml
      - packages/gb_status.yaml
      - packages/gb_sensors.yaml
      - packages/gb_superior.yaml       # or gb_extra.yaml / gb_pro.yaml / gb_mtop.yaml (MAGIS M TOP heat pump)
                                        # / gb_iu23.yaml (IMG-BUS boiler + IU23 interface, hypothesis)
      - packages/gb_curve.yaml          # optional: weather curve in the hub
      - packages/gb_programs.yaml       # optional: CH / DHW programs, anti-legionella, vacation, summer / winter (needs gb_curve)
      - packages/gb_computed.yaml       # optional: delta T, condensing, burner power, operating state
      - packages/gb_analytics.yaml      # optional: burner starts / short cycling, heat and gas today, gas cost (needs gb_computed)
      - packages/gb_superior_calc.yaml  # optional, per model: gb_superior_calc / gb_extra_calc / gb_pro_calc (needs gb_computed); MAGIS M TOP: gb_mtop_calc alone
      - packages/gb_boiler_params.yaml  # optional: boiler model / interface (setup hints) + service reminder
      - packages/gb_busmap.yaml         # optional: register scanner for the bus map card
