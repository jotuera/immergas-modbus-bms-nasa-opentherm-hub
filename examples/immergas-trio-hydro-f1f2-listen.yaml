# Immergas TRIO HYDRO - F1 / F2 only, listen only: the first test (planned, looking for testers)
# One AtomS3 Lite and one M5Stack Isolated RS485 Unit, in parallel on F1 / F2 (Samsung NASA, outdoor unit UE HYDRO HP <->
# interface board A22). No PortABC, no OpenTherm, no zone bus. Works for the ELECTRIC and the HYBRID.
# Wiring: Grove AtomS3 socket (next to USB-C) -> Isolated RS485 Unit (RX G1, TX G2) -> F1 / F2, no resistor.
#   Already on the PortABC? Port B works too, and it is where F1 / F2 goes in the full HYBRID and ELECTRIC configurations:
#   f1f2_uart_rx_pin: GPIO8, f1f2_uart_tx_pin: GPIO7.
# The hub sends NOTHING on the bus: f1f2_transmit: "false", and the f1f2_control and f1f2_fsv packages are not loaded.
# The F1 / F2 map comes from MAGIS PRO / COMBO V2 - on TRIO HYDRO it is a hypothesis to check (docs/trio-hydro.md).
# After flashing, in Home Assistant: switch on "Immergas FF - NASA Sniffer" and "Immergas FF - Discovery (context change
# log)", then save the logs (docs/collecting-logs.md, section 4: one change at a time, with the exact time).
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-trio-hydro-f1f2
  friendly_name: Immergas TRIO HYDRO F1F2

  f1f2_name_prefix: "Immergas FF - "

  # F1 / F2 on the Grove AtomS3 socket (white wire = RX)
  f1f2_uart_rx_pin: GPIO1
  f1f2_uart_tx_pin: GPIO2
  f1f2_transmit: "false"        # listen only
  # f1f2_indoor_address: "20.00.01"   # check the addresses in the F1 / F2 log first (README "Finding the addresses")

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: DEBUG                  # this file is for collecting logs
  hardware_uart: USB_SERIAL_JTAG   # logs over USB, the UART stays free for the RS485 bus
  logs:
    f1f2_sniff: DEBUG           # F1 / F2 (NASA) value changes
    sensor: WARN                # hides the routine "new value" lines
    binary_sensor: WARN
    text_sensor: WARN

api:
  encryption:
    key: !secret immergas_trio_api_key
  reboot_timeout: 0s   # the listener keeps running while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_trio_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:

captive_portal:

external_components:
  - source: github://jotuera/immergas-modbus-bms-nasa-opentherm-hub@main
    components: [f1f2_nasa]

packages:
  trio:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      # languages: every packages/lang/<package>_xx.yaml = cs de en es fr hu it nl pl pt sk
      - packages/lang/f1f2_en.yaml
      - packages/f1f2_core.yaml
      - packages/f1f2_indoor.yaml
      - packages/f1f2_outdoor.yaml
      - packages/f1f2_info.yaml
      - packages/f1f2_computed.yaml
      - packages/f1f2_diagnostics.yaml  # undecoded PDUs + bus sniffer
