# Immergas Magis Pro / Combo V2 hub - example configuration
# One AtomS3 (Lite) + ATOMIC PortABC + 3x M5Stack Isolated RS485 Unit on all three buses of the unit:
#   Port A  D+/D-  (boiler <-> Dominus / zone panel, the hub emulates zone 1 panel 0x29)
#   Port B  F1/F2  (Samsung NASA, indoor <-> outdoor unit)
#   Port C  T-/T+  (BMS Modbus, the hub is master, boiler = slave 11)
# Copy to your ESPHome folder, set the secrets and flash. Entity names follow the language files below.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub. Loaded packages come straight from GitHub (pin `ref` to a release).

substitutions:
  device_name: immergas-hub
  friendly_name: Immergas Hub

  # entity name prefixes: "<prefix> - <name>" (the cards find the entities whatever prefix you choose)
  hub_name_prefix: "Immergas Hub"
  dd_name_prefix: "Immergas DD"
  tt_name_prefix: "Immergas TT"
  f1f2_name_prefix: "Immergas FF - "

  # D+/D- on Port A, F1/F2 on Port B, T-/T+ on Port C (white wire = RX)
  dd_uart_rx_pin: GPIO39
  dd_uart_tx_pin: GPIO38
  dd_uart_de_pin: none        # the isolated units switch the direction themselves
  f1f2_uart_rx_pin: GPIO8
  f1f2_uart_tx_pin: GPIO7
  tt_uart_rx_pin: GPIO6
  tt_uart_tx_pin: GPIO5
  tt_uart_de_pin: none

  # F1/F2 writes (outing mode, compressor limit FR, outing FSV 5011-5019 only) stay OFF after every start until you
  # arm them with the switch "Active ODU control"; ALWAYS_ON keeps them armed once the hub runs well for you
  f1f2_write_arm_restore: ALWAYS_OFF

  # currency in the price / cost units and useful heat from 1 m³ of gas (Magis Combo)
  hub_currency: "€"
  hub_gas_heat_kwh_per_m3: "10.6"

  # optional: Home Assistant entities offered as zone 1 temperature / humidity sources (DD "... source" selects)
  # dd_temp_src_2: sensor.average_temperature_ground_floor
  # dd_hum_src_2: sensor.average_humidity_ground_floor

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # logs over USB, all three UARTs stay free

api:
  encryption:
    key: !secret immergas_hub_api_key
  reboot_timeout: 0s   # the D+/D- emulation must keep serving the boiler while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_hub_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # no Wi-Fi does not restart the ESP: the buses keep running
  ap:

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  auth:   # the device controls the boiler and the heat pump
    username: !secret immergas_hub_web_username
    password: !secret immergas_hub_web_password

external_components:
  - source: github://jotuera/immergas-modbus-bms-nasa-opentherm-hub@v1.11.13
    components: [immergas_core, immergas_climate, f1f2_nasa]

packages:
  hub:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: v1.11.13
    refresh: 1d
    files:
      # languages: every packages/lang/<package>_xx.yaml = cs de en es fr hu it nl pl pt sk
      - packages/lang/hub_en.yaml
      - packages/lang/hub_analytics_en.yaml
      - packages/lang/dd_en.yaml
      - packages/lang/tt_en.yaml
      - packages/lang/f1f2_en.yaml
      # D+/D-
      - packages/dd_core.yaml
      - packages/dd_engine.yaml
      - packages/dd_zone1.yaml
      - packages/dd_zones23.yaml
      - packages/dd_dhw.yaml
      - packages/dd_dominus.yaml
      - packages/dd_schedules.yaml
      - packages/dd_heat_pump.yaml
      - packages/dd_boiler_info.yaml
      - packages/dd_diagnostics.yaml
      # T-/T+
      - packages/tt_core.yaml
      - packages/tt_status.yaml
      - packages/tt_circuit.yaml
      - packages/tt_heat_pump.yaml
      - packages/tt_dhw.yaml
      - packages/tt_heating.yaml
      - packages/tt_integration.yaml
      - packages/tt_installer.yaml
      - packages/tt_computed.yaml
      - packages/tt_gas.yaml
      - packages/tt_diagnostics.yaml
      # - packages/tt_scanner.yaml      # optional: T-/T+ PDU scanner for the bus map (finds undescribed registers)
      # F1/F2
      - packages/f1f2_core.yaml
      - packages/f1f2_indoor.yaml
      - packages/f1f2_outdoor.yaml
      - packages/f1f2_info.yaml
      - packages/f1f2_computed.yaml
      - packages/f1f2_diagnostics.yaml
      - packages/f1f2_control.yaml
      - packages/f1f2_outing_targets.yaml
      # - packages/f1f2_fsv.yaml        # optional: all 94 FSV installer settings of the Samsung side (read only, polls the unit)
      # - packages/f1f2_ehs_extra.yaml  # optional: Samsung EHS values a MAGIS does not provide (zone 2, flow, COP, PV, SG)
      # hub: values from all three buses, boiler menu settings for the cards, hardware profile
      - packages/hub_diagnostics.yaml
      - packages/hub_combined.yaml
      # statistics for the Today card: comfort, cycling, building, DHW draws, CH / DHW energy split, degree days,
      # bus availability, defrost, boiler joins (optional, needs hub_combined)
      - packages/hub_analytics.yaml
      # bus map report (undescribed registers of D+/D-, T-/T+ and F1/F2 as a pre-filled GitHub issue)
      - packages/hub_busmap.yaml
      - packages/hub_boiler_params.yaml
      # - packages/hub_boiler_menu.yaml  # MAGIS without T-/T+ (e.g. HERCULES PRO): copies of R04/R05/R13/R12, T02/T05/T07, A03/A04, P15
      - packages/hw_atoms3_portabc.yaml

switch:
  # D+/D- emulation starts OFF: the hub only listens until you switch on what your bus is missing (README, "First
  # start"): "Emulate Panel Zone 1" (0x29) next to a real Dominus, or "Emulate Dominus" (0x33) without one. The choice
  # is remembered; a device that already answers on that address blocks the emulation.
  - id: !extend dd_emulate_33_switch
    restore_mode: RESTORE_DEFAULT_OFF
  - id: !extend dd_emulate_29_switch
    restore_mode: RESTORE_DEFAULT_OFF
