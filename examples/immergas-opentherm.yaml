# Immergas OpenTherm boiler - MASTER example configuration (VICTRIX ZEUS / EXA / TERA / OMNIA / HERCULES Condensing ...)
# The hub replaces the room unit (CAR V2 / Super Amico / Dominus) on the boiler's OpenTherm terminals: weather curve,
# room correction, programs and the DHW run in the hub.
# Hardware: AtomS3 Lite + ATOMIC ToUnit Base + DIYLess Master OpenTherm Shield:
#   ToUnit Base under the AtomS3 Lite, DIP switches 2 and 5 on: female Dupont wires on its male plug,
#     white IO2 = G6 -> D2 (in), yellow IO1 = G5 -> D1 (out)
#   Grove AtomS3 socket (next to USB-C), Grove -> Dupont cable: black GND -> GND, white G1 = 3.3 V -> 3V3 (ot_3v3_supply)
#   Master shield B1 / B2 -> boiler OpenTherm terminals (41 / 44 on most Immergas boilers)
# On the boiler: remove the room unit / Dominus, put jumper X40 back on 40-41, power-cycle the boiler (E31).
# Wiring diagram: docs/opentherm-hub.md#wiring. Gateway mode (the room unit stays): immergas-opentherm-gateway.yaml.
# Experimental: written from the OpenTherm specification and the Immergas findings of the Dominus integration, not
# tested on a boiler yet.
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-opentherm
  friendly_name: Immergas OpenTherm
  ot_name_prefix: "Immergas OT"
  ot_boiler_in_pin: GPIO6     # ToUnit Base IO2, white wire -> D2
  ot_boiler_out_pin: GPIO5    # ToUnit Base IO1, yellow wire -> D1
  # regulator: a Home Assistant room temperature (optional)
  ot_room_entity: sensor.living_room_temperature

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret immergas_ot_api_key
  reboot_timeout: 0s   # the boiler must keep getting its OpenTherm frames while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_ot_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:

captive_portal:

packages:
  opentherm:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      - packages/lang/ot_en.yaml        # or _cs _de _es _fr _hu _it _nl _pl _pt _sk
      - packages/ot_core.yaml
      - packages/ot_sensors.yaml
      - packages/ot_stats.yaml         # optional: burner starts today / last hour, burner time today
      - packages/ot_computed.yaml      # optional: delta T, condensing, burner power, link quality, pressure drop, operating state
      - packages/ot_supervision.yaml   # optional: is the CH demand really taken up by the boiler
      - packages/ot_analytics.yaml     # optional: gas and its cost, condensing share, short cycling, DHW draws (needs ot_stats, ot_computed)
      - packages/ot_control.yaml
      - packages/ot_regulator.yaml      # master: weather curve + room correction in the hub
      - packages/ot_programs.yaml       # optional: CH / DHW programs, anti-legionella, vacation, summer / winter, frost
      - packages/ot_boiler_params.yaml  # optional: the boiler menu copied once (codes, hints) + service reminder
      - packages/ot_3v3_supply.yaml     # G1 of the Grove AtomS3 = 3.3 V for the shields (their 3V3 pin)
