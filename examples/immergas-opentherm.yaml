# Immergas OpenTherm boiler - example configuration (VICTRIX ZEUS / EXA / TERA / OMNIA / HERCULES Condensing ...)
# One AtomS3 Lite with DIYLess OpenTherm shields (NOT the RS485 units), each on an M5Stack Grove -> Dupont cable:
#   MASTER  (default): the Master shield on the AtomS3 Lite's own Grove port (white G1 = in, yellow G2 = out) -> boiler
#                      OpenTherm terminals; no PortABC needed. The hub replaces the CAR V2 / Super Amico / Dominus: remove
#                      the room unit, put jumper X40 back on 40-41, power-cycle the boiler.
#   GATEWAY: + an ATOMIC PortABC: port A = Master shield (white G39 = in, yellow G38 = out), port C = Slave shield (white
#            G6 = in, yellow G5 = out) -> the room unit, which stays and is relayed (uncomment ot_gateway and the pins
#            below). Port B (G8 / G7) stays free for an RS485 bus.
# Experimental: written from the OpenTherm specification and the Immergas findings of the Dominus integration, not
# tested on a boiler yet.
# Copy to your ESPHome folder, set the secrets and flash. Loaded packages come straight from GitHub (pin `ref`).

substitutions:
  device_name: immergas-opentherm
  friendly_name: Immergas OpenTherm
  ot_name_prefix: "Immergas OT"
  ot_boiler_in_pin: GPIO1     # master: AtomS3 Lite Grove port, white wire (gateway with PortABC: port A = GPIO39)
  ot_boiler_out_pin: GPIO2    # yellow wire (gateway with PortABC: port A = GPIO38)
  # gateway only: the Slave shield on ATOMIC PortABC port C (towards the room unit)
  # ot_room_in_pin: GPIO6     # white wire
  # ot_room_out_pin: GPIO5    # yellow wire
  # regulator: a Home Assistant room temperature (optional)
  ot_room_entity: sensor.living_room_temperature

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret immergas_ot_api_key
  reboot_timeout: 0s   # the boiler must keep getting its OpenTherm frames while Home Assistant is down

ota:
  - platform: esphome
    password: !secret immergas_ot_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:

captive_portal:

packages:
  opentherm:
    url: https://github.com/jotuera/immergas-modbus-bms-nasa-opentherm-hub
    ref: main
    refresh: 1d
    files:
      - packages/lang/ot_en.yaml        # or ot_pl.yaml
      - packages/ot_core.yaml
      - packages/ot_sensors.yaml
      - packages/ot_stats.yaml         # optional: burner starts today / last hour, burner time today
      - packages/ot_computed.yaml      # optional: delta T, condensing, burner power, link quality, pressure drop, operating state
      - packages/ot_analytics.yaml     # optional: gas and its cost, condensing share, short cycling, DHW draws (needs ot_stats, ot_computed)
      - packages/ot_control.yaml
      - packages/ot_regulator.yaml      # master: weather curve + room correction in the hub
      - packages/ot_programs.yaml       # optional: CH / DHW programs, anti-legionella, vacation, summer / winter, frost
      - packages/ot_boiler_params.yaml  # optional: the boiler menu copied once (codes, hints) + service reminder
      # - packages/ot_gateway.yaml      # gateway: the room unit stays (needs the slave adapter)
