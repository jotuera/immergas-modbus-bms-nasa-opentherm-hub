# IMMERGAS Modbus BMS NASA OpenTherm HUB - package hub_analytics, entity names: Español
# Loaded by the main YAML next to hub_analytics.yaml (packages: hub_analytics_lang: !include lang/hub_analytics_xx.yaml).
# Changing the language renames the entities: Home Assistant then creates new entities (history stays on the old ones).

