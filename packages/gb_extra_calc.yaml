# Immergas gas boiler BMS - package "gb_extra_calc" (optional, with gb_extra and gb_computed): VICTRIX EXTRA / EXTRA PLUS
# Computed in the hub from this model's extra registers: the heat output measured from the pump flow, flue gas minus return, the system pressure drop over 24 h with a possible
# leak warning, the DHW share of the burner hours.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

substitutions:
  # pressure drop over 24 h that raises the possible leak warning, bar
  gb_leak_bar_day: "0.2"

globals:
  - { id: gb_p_hist, type: "std::vector<float>" }
  - { id: gb_p_tick, type: int, initial_value: "0" }

interval:
  - interval: 10s
    then:
      - lambda: |-
          // heat output measured: flow x 4.186 x delta T (kW); gb_power uses it instead of the modulation estimate
          float q = id(gb_pump_flow).state, f = id(gb_flow_temp).state, r = id(gb_return_temp).state;
          id(gb_q_meas) = std::isnan(q) || std::isnan(f) || std::isnan(r) ? NAN : q / 60.0f * 4.186f * (f - r);
          id(gb_heat_meas).publish_state(std::isnan(id(gb_q_meas)) ? NAN : std::max(0.0f, id(gb_q_meas)));

sensor:
  - { platform: template, name: "${n_gb_heat_meas}", id: gb_heat_meas, icon: "mdi:radiator", unit_of_measurement: "kW", device_class: power, state_class: measurement, accuracy_decimals: 2 }
  - platform: template
    name: "${n_gb_flue_return}"
    id: gb_flue_return
    icon: mdi:smoke
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float e = id(gb_flue_temp).state, r = id(gb_return_temp).state;
      return !id(gb_flame).state || std::isnan(e) || std::isnan(r) ? NAN : e - r;
  - platform: template
    name: "${n_gb_pressure_drop}"
    id: gb_pressure_drop
    icon: mdi:gauge-low
    unit_of_measurement: "bar"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // a sample every 60 minutes; the drop = the oldest of the last 24 h minus now
      float p = id(gb_pressure).state;
      auto &v = id(gb_p_hist);
      if (!std::isnan(p) && (v.empty() || ++id(gb_p_tick) >= 60)) { id(gb_p_tick) = 0; v.push_back(p); if (v.size() > 25) v.erase(v.begin()); }
      if (v.size() < 2 || std::isnan(p)) return NAN;
      return v.front() - p;
  - platform: template
    name: "${n_gb_dhw_hours_share}"
    id: gb_dhw_hours_share
    icon: mdi:chart-pie
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      float d = id(gb_burner_hours_dhw).state, c = id(gb_burner_hours_ch).state;
      return std::isnan(d) || std::isnan(c) || d + c < 1 ? NAN : d / (d + c) * 100.0f;

binary_sensor:
  - platform: template
    name: "${n_gb_leak_warning}"
    id: gb_leak_warning
    device_class: problem
    lambda: |-
      float d = id(gb_pressure_drop).state;
      return !std::isnan(d) && d >= ${gb_leak_bar_day};
