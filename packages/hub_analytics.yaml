# IMMERGAS Modbus BMS NASA OpenTherm HUB - package "hub_analytics" (optional, with hub_combined)
# Statistics counted in the hub every 10 s from the three buses, reset at midnight (Home Assistant time from F1/F2; the
# day's values survive a restart - flash written every 10 min, see tt_gas):
#   A comfort of Zone 1 - time in comfort (room within the band around the target), too cold / too warm, room min / max,
#     mean deviation;
#   B cycling - compressor starts in the last hour, mean / last cycle, last pause, short cycles, CH / DHW starts, short
#     boiler burns and the last burn; a compressor stop shorter than hub_an_brief_stop_s (the 4-way valve reversal before
#     and after a defrost) does not end the cycle, so a defrost is not counted as two starts and a short cycle; after a
#     boot a compressor / burner already running is not counted as a start;
#   C building - room heating / cooling rate (at least 30 min of one zone state), heat loss coefficient (cooling rate
#     / (room - outdoor)), suggested U03 curve offset change from the mean room deviation of the last 3-5 heating
#     days (only a hint, nothing is written);
#   D DHW - cycles, mean cycle, hot water and heat used (cylinder drops outside DHW heating x the cylinder volume of
#     hub_combined), standing loss (01-05 without heating), cylinder minimum;
#   E energy split today - heat pump electricity and heat for CH / DHW, COP CH and COP DHW, heat from gas, the boiler
#     share of the heat, the energy cost (prices of hub_combined);
#   F weather and links - outdoor min / max / 24 h mean, degree days (base 18 °C) today and this month, heating hours
#     and CH electricity per degree day, availability of D+/D-, T-/T+, F1/F2 and the link breaks;
#   G defrost - defrosts today, mean / last defrost, defrost share of the compressor time;
#   H hybrid - boiler CH joins, heat pump + boiler together, boiler only, outdoor at the last join and the learned
#     bivalent point (mean outdoor at the joins - compare with I10);
#   freeze risk - room below 8 °C or cylinder below 5 °C.
# Needs the dd_, tt_ (with tt_gas) and f1f2_ packages and hub_combined. Names: lang/hub_analytics_xx (en, pl).
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

substitutions:
  # room within +/- this of the target counts as comfort, K
  hub_an_comfort_band: "0.5"
  # a compressor run shorter than this counts as a short cycle, minutes
  hub_an_short_cycle_min: "10"
  # a compressor stop shorter than this does not end the cycle (the valve reversal around a defrost: 20-70 s), seconds
  hub_an_brief_stop_s: "150"
  # a boiler burn shorter than this counts as a short burn, minutes
  hub_an_short_burn_min: "5"
  # degree-day base temperature, °C
  hub_an_dd_base: "18"
  # freeze risk below this room temperature, °C
  hub_an_freeze_room: "8"
  # cold mains water for the litres of hot water used, °C
  hub_an_cold_water: "10"

globals:
  - { id: hub_ag_doy, type: int, restore_value: true, initial_value: "-1" }
  - { id: hub_ag_month, type: int, restore_value: true, initial_value: "-1" }
  # A
  - { id: hub_ag_known_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_comfort_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_cold_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_warm_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_dev_sum, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_room_min, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_room_max, type: float, restore_value: true, initial_value: "NAN" }
  # B
  - { id: hub_ag_hp_was, type: bool, initial_value: "false" }
  - { id: hub_ag_hp_on_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_hp_off_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_hp_dhw_run, type: bool, initial_value: "false" }
  - { id: hub_ag_hp_pend, type: bool, initial_value: "false" }
  - { id: hub_ag_hp_init, type: bool, initial_value: "false" }
  - { id: hub_ag_hp_pend_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_hp_start_ms, type: "std::vector<uint32_t>" }
  - { id: hub_ag_cyc_n, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_cyc_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_cyc_last, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_pause_last, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_short_n, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_st_ch, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_st_dhw, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_bn_was, type: bool, initial_value: "false" }
  - { id: hub_ag_bn_on_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_bn_short, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_bn_last, type: float, restore_value: true, initial_value: "NAN" }
  # C
  - { id: hub_ag_seg_on, type: int, initial_value: "-1" }
  - { id: hub_ag_seg_t0, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_seg_r0, type: float, initial_value: "NAN" }
  - { id: hub_ag_seg_rsum, type: float, initial_value: "0" }
  - { id: hub_ag_seg_osum, type: float, initial_value: "0" }
  - { id: hub_ag_seg_n, type: int, initial_value: "0" }
  - { id: hub_ag_seg_on_n, type: int, initial_value: "0" }
  - { id: hub_ag_heat_rate, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_cool_rate, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_loss_coef, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_hd_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_hd_dev, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_hint_hist, type: "std::array<float, 5>", restore_value: true, initial_value: "std::array<float, 5>{NAN, NAN, NAN, NAN, NAN}" }
  # D
  - { id: hub_ag_dhw_was, type: bool, initial_value: "false" }
  - { id: hub_ag_dhw_on_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_dhw_n, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_dhw_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_tank_ref, type: float, initial_value: "NAN" }
  - { id: hub_ag_tank_ref_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_dhw_drop, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_dhw_l, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_tank_min, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_night_t0, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_night_t1, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_night_k0, type: float, initial_value: "NAN" }
  - { id: hub_ag_night_k1, type: float, initial_value: "NAN" }
  - { id: hub_ag_standing, type: float, restore_value: true, initial_value: "NAN" }
  # E
  - { id: hub_ag_e_ch, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_e_dhw, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_q_ch, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_q_dhw, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_q_def, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_g_ch, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_g_dhw, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_gas_prev, type: double, initial_value: "-1.0" }
  # F
  - { id: hub_ag_out_min, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_out_max, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_dd_today, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_dd_month, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_ch_on_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_out_ring, type: "std::array<float, 96>", restore_value: true, initial_value: "std::array<float, 96>{}" }
  - { id: hub_ag_out_idx, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_out_fill, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_out_acc, type: float, initial_value: "0" }
  - { id: hub_ag_out_n, type: int, initial_value: "0" }
  - { id: hub_ag_out_ticks, type: int, initial_value: "0" }
  - { id: hub_ag_tt_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_ff_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_av_tick, type: "std::array<float, 3>", restore_value: true, initial_value: "std::array<float, 3>{0, 0, 0}" }
  - { id: hub_ag_av_ok, type: "std::array<float, 3>", restore_value: true, initial_value: "std::array<float, 3>{0, 0, 0}" }
  - { id: hub_ag_av_seen, type: "std::array<bool, 3>", initial_value: "std::array<bool, 3>{false, false, false}" }
  - { id: hub_ag_av_prev, type: "std::array<bool, 3>", initial_value: "std::array<bool, 3>{false, false, false}" }
  - { id: hub_ag_breaks, type: int, restore_value: true, initial_value: "0" }
  # G
  - { id: hub_ag_df_was, type: bool, initial_value: "false" }
  - { id: hub_ag_df_on_ms, type: uint32_t, initial_value: "0" }
  - { id: hub_ag_df_n, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_df_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_df_last, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_hp_run_s, type: float, restore_value: true, initial_value: "0" }
  # H
  - { id: hub_ag_gm_prev, type: int, initial_value: "0" }
  - { id: hub_ag_j_n, type: int, restore_value: true, initial_value: "0" }
  - { id: hub_ag_both_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_bonly_s, type: float, restore_value: true, initial_value: "0" }
  - { id: hub_ag_j_out, type: float, restore_value: true, initial_value: "NAN" }
  - { id: hub_ag_biv, type: float, restore_value: true, initial_value: "NAN" }

interval:
  - interval: 10s
    then:
      - lambda: |-
          const float dt = 10.0f;
          uint32_t now = millis();
          auto tm = id(f1f2_time).now();
          int hour = tm.is_valid() ? tm.hour : -1;
          bool night = hour >= 1 && hour < 5;
          float hz = id(dd_sniff_1e_i_11).state;
          bool hp = !std::isnan(hz) && hz > 0.0f;
          int gm = id(tt_gas_mode);
          bool bn = gm != 0;
          float d99f = id(tt_system_state_raw).state;
          int d99 = std::isnan(d99f) ? -1 : (int) d99f;
          bool d09 = d99 < 0 && id(dd_piec_zadanie_cwu_oczek).state;   // no T-/T+: D09 from D+/D-
          bool heater = id(hub_dhw_heater_on).state;                    // DHW electric heater (assumed, hub_combined)
          bool dhw = d09 || heater || d99 == 61 || d99 == 62 || d99 == 64;
          bool dhw_any = dhw || d99 == 44 || d99 == 45;
          bool df = id(f1f2_defrost).state;
          float room = id(dd_zone1_temp_sensor).state, tgt = id(dd_zone1_setpoint_number).state;
          float out = id(dd_outside_temp_sensor).state, tank = id(dd_dhw_temp_sensor).state;
          bool room_ok = !std::isnan(room) && room > 1.0f && room < 40.0f;
          bool out_ok = !std::isnan(out) && out > -40.0f && out < 50.0f;
          bool tank_ok = !std::isnan(tank) && tank > 1.0f && tank < 95.0f;
          int mode = id(dd_operating_mode_reported);
          bool winter = mode == 2 || mode == 3;
          bool chreq = id(dd_bs_zone1_heat_request).state;

          // A: comfort of Zone 1 (+ the curve hint: Comfort / Manual phase in winter, not Eco)
          if (room_ok && !std::isnan(tgt) && tgt > 1.0f) {
            float dev = room - tgt;
            id(hub_ag_known_s) += dt;
            id(hub_ag_dev_sum) += dev * dt;
            if (fabsf(dev) <= ${hub_an_comfort_band}) id(hub_ag_comfort_s) += dt;
            else if (dev < 0) id(hub_ag_cold_s) += dt;
            else id(hub_ag_warm_s) += dt;
            if (winter && id(dd_zone1_phase_text).state != "${t_dd_phase_eco}") {
              id(hub_ag_hd_s) += dt;
              id(hub_ag_hd_dev) += dev * dt;
            }
          }
          if (room_ok) {
            if (std::isnan(id(hub_ag_room_min)) || room < id(hub_ag_room_min)) id(hub_ag_room_min) = room;
            if (std::isnan(id(hub_ag_room_max)) || room > id(hub_ag_room_max)) id(hub_ag_room_max) = room;
          }

          // B: compressor and boiler cycles. A stop is held as pending: a restart within hub_an_brief_stop_s (the valve
          // reversal before and after a defrost) continues the same cycle, only a longer stop ends it (at the stop time).
          auto cyc_end = [&](uint32_t off) {
            id(hub_ag_hp_pend) = false;
            if (!id(hub_ag_hp_on_ms)) { id(hub_ag_hp_off_ms) = off; return; }  // running since before the boot: length unknown
            float len = (off - id(hub_ag_hp_on_ms)) / 60000.0f;
            id(hub_ag_cyc_last) = len;
            id(hub_ag_cyc_n)++;
            id(hub_ag_cyc_s) += len * 60.0f;
            if (len < ${hub_an_short_cycle_min}) id(hub_ag_short_n)++;
            if (id(hub_ag_hp_dhw_run)) id(hub_ag_st_dhw)++; else id(hub_ag_st_ch)++;
            id(hub_ag_hp_off_ms) = off;
            id(hub_ag_hp_pend) = false;
          };
          const uint32_t brief = ${hub_an_brief_stop_s} * 1000UL;
          // after a boot the hub does not know how long the compressor / burner have been running: the first reading of
          // both buses only takes their state (a compressor already running is not a new start), counting starts from the
          // next change
          if (!id(hub_ag_hp_init)) {
            if (!std::isnan(hz) && (d99 >= 0 || now > 120000UL)) {   // T-/T+ state, or 2 min without T-/T+
              id(hub_ag_hp_was) = hp; id(hub_ag_hp_on_ms) = 0;
              id(hub_ag_bn_was) = bn; id(hub_ag_bn_on_ms) = 0;
              id(hub_ag_hp_init) = true;
            }
          } else {
            if (!hp && id(hub_ag_hp_pend) && now - id(hub_ag_hp_pend_ms) >= brief) cyc_end(id(hub_ag_hp_pend_ms));
            if (hp && !id(hub_ag_hp_was)) {
              if (id(hub_ag_hp_pend) && now - id(hub_ag_hp_pend_ms) < brief) {
                id(hub_ag_hp_pend) = false;  // defrost reversal: the same cycle goes on
              } else {
                if (id(hub_ag_hp_pend)) cyc_end(id(hub_ag_hp_pend_ms));
                id(hub_ag_hp_start_ms).push_back(now);
                if (id(hub_ag_hp_off_ms)) id(hub_ag_pause_last) = (now - id(hub_ag_hp_off_ms)) / 60000.0f;
                id(hub_ag_hp_on_ms) = now;
                id(hub_ag_hp_dhw_run) = false;
              }
            }
            if (hp && dhw_any) id(hub_ag_hp_dhw_run) = true;
            if (!hp && id(hub_ag_hp_was)) {
              id(hub_ag_hp_pend) = true;
              id(hub_ag_hp_pend_ms) = now;
            }
            id(hub_ag_hp_was) = hp;
            if (bn && !id(hub_ag_bn_was)) id(hub_ag_bn_on_ms) = now;
            if (!bn && id(hub_ag_bn_was) && id(hub_ag_bn_on_ms)) {
              float len = (now - id(hub_ag_bn_on_ms)) / 60000.0f;
              id(hub_ag_bn_last) = len;
              if (len < ${hub_an_short_burn_min}) id(hub_ag_bn_short)++;
            }
            id(hub_ag_bn_was) = bn;
          }
          if (hp) id(hub_ag_hp_run_s) += dt;
          if ((hp || bn) && !dhw_any) id(hub_ag_ch_on_s) += dt;

          // C: room slope over one stretch of the zone heat request (>= 30 min)
          if (room_ok) {
            int st = chreq ? 1 : 0;
            if (st != id(hub_ag_seg_on)) {
              id(hub_ag_seg_on) = st; id(hub_ag_seg_t0) = now; id(hub_ag_seg_r0) = room;
              id(hub_ag_seg_rsum) = 0; id(hub_ag_seg_osum) = 0; id(hub_ag_seg_n) = 0; id(hub_ag_seg_on_n) = 0;
            }
            id(hub_ag_seg_n)++;
            id(hub_ag_seg_rsum) += room;
            if (out_ok) { id(hub_ag_seg_osum) += out; id(hub_ag_seg_on_n)++; }
            float hrs = (now - id(hub_ag_seg_t0)) / 3600000.0f;
            if (hrs >= 0.5f && id(hub_ag_seg_n) >= 5) {
              float rate = (room - id(hub_ag_seg_r0)) / hrs;
              if (st) id(hub_ag_heat_rate) = rate;
              else {
                id(hub_ag_cool_rate) = -rate;
                if (id(hub_ag_seg_on_n) > 0) {
                  float gap = id(hub_ag_seg_rsum) / id(hub_ag_seg_n) - id(hub_ag_seg_osum) / id(hub_ag_seg_on_n);
                  if (gap > 5.0f && rate < 0) id(hub_ag_loss_coef) = -rate / gap;
                }
              }
            }
          }

          // D: DHW cycles, draws (cylinder drops outside DHW heating, standing loss taken off) and the standing loss
          if (dhw && !id(hub_ag_dhw_was)) { id(hub_ag_dhw_n)++; id(hub_ag_dhw_on_ms) = now; }
          if (!dhw && id(hub_ag_dhw_was) && id(hub_ag_dhw_on_ms)) id(hub_ag_dhw_s) += (now - id(hub_ag_dhw_on_ms)) / 1000.0f;
          id(hub_ag_dhw_was) = dhw;
          if (tank_ok) {
            if (std::isnan(id(hub_ag_tank_min)) || tank < id(hub_ag_tank_min)) id(hub_ag_tank_min) = tank;
            if (dhw_any) id(hub_ag_tank_ref) = NAN;
            else if (std::isnan(id(hub_ag_tank_ref)) || tank > id(hub_ag_tank_ref)) {
              id(hub_ag_tank_ref) = tank; id(hub_ag_tank_ref_ms) = now;
            } else if (id(hub_ag_tank_ref) - tank >= 0.3f) {
              float drop = id(hub_ag_tank_ref) - tank;
              float sl = std::isnan(id(hub_ag_standing)) ? 0.0f : id(hub_ag_standing);
              drop -= sl * (now - id(hub_ag_tank_ref_ms)) / 3600000.0f;
              if (!night && drop > 0.1f) {
                id(hub_ag_dhw_drop) += drop;
                if (tank > ${hub_an_cold_water}) id(hub_ag_dhw_l) += id(hub_dhw_tank_volume).state * drop / (tank - ${hub_an_cold_water});
              }
              id(hub_ag_tank_ref) = tank; id(hub_ag_tank_ref_ms) = now;
            }
            if (night && !dhw_any) {
              if (!id(hub_ag_night_t0)) { id(hub_ag_night_t0) = now; id(hub_ag_night_k0) = tank; }
              id(hub_ag_night_t1) = now; id(hub_ag_night_k1) = tank;
            } else if (id(hub_ag_night_t0)) {
              float h = (id(hub_ag_night_t1) - id(hub_ag_night_t0)) / 3600000.0f;
              float k = id(hub_ag_night_k0) - id(hub_ag_night_k1);
              if (!dhw_any && h >= 2.0f && k >= 0.0f) id(hub_ag_standing) = k / h;
              id(hub_ag_night_t0) = 0;
            }
          }

          // E: electricity and heat of the heat pump for CH / DHW, gas for CH / DHW
          float pe = id(hub_elec_power_bus).state, pq = id(hub_heat_power).state, pd = id(hub_defrost_heat_power).state;
          if (!std::isnan(pe) && pe > 0) { if (dhw_any) id(hub_ag_e_dhw) += pe * dt / 3.6e6f; else id(hub_ag_e_ch) += pe * dt / 3.6e6f; }
          if (!std::isnan(pq) && pq > 0) { if (dhw_any) id(hub_ag_q_dhw) += pq * dt / 3.6e6f; else id(hub_ag_q_ch) += pq * dt / 3.6e6f; }
          // DHW electric heater (not on any bus): the assumed power counts as DHW electricity and heat at COP 1
          float kwh_h = id(hub_dhw_heater_on).state ? id(hub_dhw_heater_kw) * dt / 3600.0f : 0.0f;
          if (kwh_h > 0) { id(hub_ag_e_dhw) += kwh_h; id(hub_ag_q_dhw) += kwh_h; }
          if (!std::isnan(pd) && pd > 0) id(hub_ag_q_def) += pd * dt / 3.6e6f;
          double g = id(tt_gas_total_m3);
          if (id(hub_ag_gas_prev) >= 0.0 && g >= id(hub_ag_gas_prev)) {
            float dg = (float) (g - id(hub_ag_gas_prev));
            if (gm == 2 || d99 == 62) id(hub_ag_g_dhw) += dg; else id(hub_ag_g_ch) += dg;
          }
          id(hub_ag_gas_prev) = g;

          // F: outdoor, degree days, 24 h mean (96 x 15 min), bus availability
          if (out_ok) {
            if (std::isnan(id(hub_ag_out_min)) || out < id(hub_ag_out_min)) id(hub_ag_out_min) = out;
            if (std::isnan(id(hub_ag_out_max)) || out > id(hub_ag_out_max)) id(hub_ag_out_max) = out;
            float k = std::max(0.0f, ${hub_an_dd_base} - out) * dt / 86400.0f;
            id(hub_ag_dd_today) += k; id(hub_ag_dd_month) += k;
            id(hub_ag_out_acc) += out; id(hub_ag_out_n)++;
          }
          if (++id(hub_ag_out_ticks) >= 90) {
            if (id(hub_ag_out_n) > 0) {
              id(hub_ag_out_ring)[id(hub_ag_out_idx)] = id(hub_ag_out_acc) / id(hub_ag_out_n);
              id(hub_ag_out_idx) = (id(hub_ag_out_idx) + 1) % 96;
              if (id(hub_ag_out_fill) < 96) id(hub_ag_out_fill)++;
            }
            id(hub_ag_out_acc) = 0; id(hub_ag_out_n) = 0; id(hub_ag_out_ticks) = 0;
          }
          uint32_t last[3] = { id(dd_last_rx_ms), id(hub_ag_tt_ms), id(hub_ag_ff_ms) };
          const uint32_t lim[3] = { 30000, 90000, 180000 };
          for (int b = 0; b < 3; b++) {
            bool ok = last[b] != 0 && now - last[b] < lim[b];
            if (ok) id(hub_ag_av_seen)[b] = true;
            if (!id(hub_ag_av_seen)[b]) continue;
            id(hub_ag_av_tick)[b] += dt;
            if (ok) id(hub_ag_av_ok)[b] += dt;
            else if (id(hub_ag_av_prev)[b]) id(hub_ag_breaks)++;
            id(hub_ag_av_prev)[b] = ok;
          }

          // G: defrost
          if (df && !id(hub_ag_df_was)) { id(hub_ag_df_n)++; id(hub_ag_df_on_ms) = now; }
          if (!df && id(hub_ag_df_was) && id(hub_ag_df_on_ms)) {
            float len = (now - id(hub_ag_df_on_ms)) / 60000.0f;
            id(hub_ag_df_last) = len;
            id(hub_ag_df_s) += len * 60.0f;
          }
          id(hub_ag_df_was) = df;

          // H: hybrid - the boiler joins CH, both together, the boiler alone, the learned bivalent point
          if (gm == 1 && id(hub_ag_gm_prev) != 1) {
            id(hub_ag_j_n)++;
            if (out_ok) {
              id(hub_ag_j_out) = out;
              id(hub_ag_biv) = std::isnan(id(hub_ag_biv)) ? out : id(hub_ag_biv) * 0.8f + out * 0.2f;
            }
          }
          id(hub_ag_gm_prev) = gm;
          if (hp && bn) id(hub_ag_both_s) += dt;
          if (bn && !hp) id(hub_ag_bonly_s) += dt;
  - interval: 30s
    then:
      - lambda: |-
          auto tm = id(f1f2_time).now();
          if (tm.is_valid() && id(hub_ag_doy) != tm.day_of_year) {
            if (id(hub_ag_doy) >= 0 && id(hub_ag_hd_s) > 3600.0f) {
              auto &h = id(hub_ag_hint_hist);
              for (int i = 0; i < 4; i++) h[i] = h[i + 1];
              h[4] = id(hub_ag_hd_dev) / id(hub_ag_hd_s);
            }
            id(hub_ag_doy) = tm.day_of_year;
            id(hub_ag_known_s) = 0; id(hub_ag_comfort_s) = 0; id(hub_ag_cold_s) = 0; id(hub_ag_warm_s) = 0; id(hub_ag_dev_sum) = 0;
            id(hub_ag_room_min) = NAN; id(hub_ag_room_max) = NAN;
            id(hub_ag_cyc_n) = 0; id(hub_ag_cyc_s) = 0; id(hub_ag_short_n) = 0; id(hub_ag_st_ch) = 0; id(hub_ag_st_dhw) = 0;
            id(hub_ag_bn_short) = 0; id(hub_ag_hd_s) = 0; id(hub_ag_hd_dev) = 0;
            id(hub_ag_dhw_n) = 0; id(hub_ag_dhw_s) = 0; id(hub_ag_dhw_drop) = 0; id(hub_ag_dhw_l) = 0; id(hub_ag_tank_min) = NAN;
            id(hub_ag_e_ch) = 0; id(hub_ag_e_dhw) = 0; id(hub_ag_q_ch) = 0; id(hub_ag_q_dhw) = 0; id(hub_ag_q_def) = 0;
            id(hub_ag_g_ch) = 0; id(hub_ag_g_dhw) = 0;
            id(hub_ag_out_min) = NAN; id(hub_ag_out_max) = NAN; id(hub_ag_dd_today) = 0; id(hub_ag_ch_on_s) = 0;
            id(hub_ag_av_tick) = {0, 0, 0}; id(hub_ag_av_ok) = {0, 0, 0}; id(hub_ag_breaks) = 0;
            id(hub_ag_df_n) = 0; id(hub_ag_df_s) = 0; id(hub_ag_hp_run_s) = 0;
            id(hub_ag_j_n) = 0; id(hub_ag_both_s) = 0; id(hub_ag_bonly_s) = 0;
            if (id(hub_ag_month) != tm.month) { id(hub_ag_month) = tm.month; id(hub_ag_dd_month) = 0; }
          }
          auto &v = id(hub_ag_hp_start_ms);
          uint32_t t = millis();
          while (!v.empty() && t - v.front() > 3600000UL) v.erase(v.begin());
          auto P = [](sensor::Sensor *s, float x) { s->publish_state(x); };
          float ks = id(hub_ag_known_s);
          // A
          P(id(hub_an_comfort_share), ks > 60 ? id(hub_ag_comfort_s) / ks * 100.0f : NAN);
          P(id(hub_an_too_cold), id(hub_ag_cold_s) / 60.0f);
          P(id(hub_an_too_warm), id(hub_ag_warm_s) / 60.0f);
          P(id(hub_an_room_min), id(hub_ag_room_min));
          P(id(hub_an_room_max), id(hub_ag_room_max));
          P(id(hub_an_room_dev_avg), ks > 60 ? id(hub_ag_dev_sum) / ks : NAN);
          // B
          P(id(hub_an_starts_hour), v.size());
          P(id(hub_an_cycle_avg), id(hub_ag_cyc_n) > 0 ? id(hub_ag_cyc_s) / 60.0f / id(hub_ag_cyc_n) : NAN);
          P(id(hub_an_cycle_last), id(hub_ag_cyc_last));
          P(id(hub_an_pause_last), id(hub_ag_pause_last));
          P(id(hub_an_short_cycles), id(hub_ag_short_n));
          P(id(hub_an_starts_ch), id(hub_ag_st_ch));
          P(id(hub_an_starts_dhw), id(hub_ag_st_dhw));
          P(id(hub_an_burner_short), id(hub_ag_bn_short));
          P(id(hub_an_burn_last), id(hub_ag_bn_last));
          // C
          P(id(hub_an_heat_rate), id(hub_ag_heat_rate));
          P(id(hub_an_cool_rate), id(hub_ag_cool_rate));
          P(id(hub_an_loss_coef), id(hub_ag_loss_coef));
          {
            float s = 0; int n = 0;
            for (float x : id(hub_ag_hint_hist)) if (!std::isnan(x)) { s += x; n++; }
            if (id(hub_ag_hd_s) > 3600.0f) { s += id(hub_ag_hd_dev) / id(hub_ag_hd_s); n++; }
            float m = n >= 3 ? s / n : NAN;
            P(id(hub_an_curve_hint_dev), m);
            P(id(hub_an_curve_hint), std::isnan(m) ? NAN : (m < -${hub_an_comfort_band} ? 1.0f : (m > ${hub_an_comfort_band} ? -1.0f : 0.0f)));
          }
          // D
          float vol = id(hub_dhw_tank_volume).state;
          P(id(hub_an_dhw_cycles), id(hub_ag_dhw_n));
          P(id(hub_an_dhw_cycle_avg), id(hub_ag_dhw_n) > 0 && id(hub_ag_dhw_s) > 0 ? id(hub_ag_dhw_s) / 60.0f / id(hub_ag_dhw_n) : NAN);
          P(id(hub_an_dhw_litres), id(hub_ag_dhw_l));
          P(id(hub_an_dhw_heat), std::isnan(vol) ? NAN : vol * 1.163f * id(hub_ag_dhw_drop) / 1000.0f);
          P(id(hub_an_standing_loss), id(hub_ag_standing));
          P(id(hub_an_tank_min), id(hub_ag_tank_min));
          // E
          float qch = std::max(0.0f, id(hub_ag_q_ch) - id(hub_ag_q_def));
          float gas_m3 = id(hub_ag_g_ch) + id(hub_ag_g_dhw), gas_q = gas_m3 * ${hub_gas_heat_kwh_per_m3};
          float hp_q = qch + id(hub_ag_q_dhw);
          float pe = id(hub_price_electricity).state, pg = id(hub_price_gas).state;
          P(id(hub_an_elec_ch), id(hub_ag_e_ch));
          P(id(hub_an_elec_dhw), id(hub_ag_e_dhw));
          P(id(hub_an_heat_ch), qch);
          P(id(hub_an_heat_dhw), id(hub_ag_q_dhw));
          P(id(hub_an_cop_ch), id(hub_ag_e_ch) >= 0.1f ? qch / id(hub_ag_e_ch) : NAN);
          P(id(hub_an_cop_dhw), id(hub_ag_e_dhw) >= 0.1f ? id(hub_ag_q_dhw) / id(hub_ag_e_dhw) : NAN);
          P(id(hub_an_gas_heat), gas_q);
          P(id(hub_an_boiler_share), hp_q + gas_q > 0.05f ? gas_q / (hp_q + gas_q) * 100.0f : NAN);
          P(id(hub_an_cost_today), std::isnan(pe) || std::isnan(pg) ? NAN : (id(hub_ag_e_ch) + id(hub_ag_e_dhw)) * pe + gas_m3 * pg);
          // F
          float ddt = id(hub_ag_dd_today);
          P(id(hub_an_out_min), id(hub_ag_out_min));
          P(id(hub_an_out_max), id(hub_ag_out_max));
          {
            float s = 0; int n = id(hub_ag_out_fill);
            for (int i = 0; i < n; i++) s += id(hub_ag_out_ring)[i];
            P(id(hub_an_out_mean), n >= 4 ? s / n : NAN);
          }
          P(id(hub_an_dd_today), ddt);
          P(id(hub_an_dd_month), id(hub_ag_dd_month));
          P(id(hub_an_h_per_dd), ddt >= 0.5f ? id(hub_ag_ch_on_s) / 3600.0f / ddt : NAN);
          P(id(hub_an_kwh_per_dd), ddt >= 0.5f ? id(hub_ag_e_ch) / ddt : NAN);
          sensor::Sensor *av[3] = { id(hub_an_avail_dd), id(hub_an_avail_tt), id(hub_an_avail_ff) };
          for (int b = 0; b < 3; b++) P(av[b], id(hub_ag_av_tick)[b] > 0 ? id(hub_ag_av_ok)[b] / id(hub_ag_av_tick)[b] * 100.0f : NAN);
          P(id(hub_an_link_breaks), id(hub_ag_breaks));
          // G
          P(id(hub_an_defrosts), id(hub_ag_df_n));
          P(id(hub_an_defrost_avg), id(hub_ag_df_n) > 0 && id(hub_ag_df_s) > 0 ? id(hub_ag_df_s) / 60.0f / id(hub_ag_df_n) : NAN);
          P(id(hub_an_defrost_last), id(hub_ag_df_last));
          P(id(hub_an_defrost_share), id(hub_ag_hp_run_s) > 600 ? id(hub_ag_df_s) / id(hub_ag_hp_run_s) * 100.0f : NAN);
          // H
          P(id(hub_an_joins), id(hub_ag_j_n));
          P(id(hub_an_both_hours), id(hub_ag_both_s) / 3600.0f);
          P(id(hub_an_boiler_only), id(hub_ag_bonly_s) / 3600.0f);
          P(id(hub_an_join_out), id(hub_ag_j_out));
          P(id(hub_an_bivalent), id(hub_ag_biv));

