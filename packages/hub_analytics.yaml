binary_sensor:
  # room below hub_an_freeze_room or the cylinder below 5 °C
  - platform: template
    name: "${n_hub_an_freeze}"
    id: hub_an_freeze
    device_class: cold
    lambda: |-
      float room = id(dd_zone1_temp_sensor).state, tank = id(dd_dhw_temp_sensor).state;
      bool r = !std::isnan(room) && room > 1.0f && room < ${hub_an_freeze_room};
      bool t = !std::isnan(tank) && tank > 0.5f && tank < 5.0f;
      return r || t;
