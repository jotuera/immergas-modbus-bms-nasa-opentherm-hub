# Immergas OpenTherm - package "ot_core"
# The immergas_ot component in the MASTER mode: the hub replaces the room unit (CAR V2 / Super Amico / Dominus) on the
# boiler's OpenTherm terminals. For the GATEWAY mode (room unit -> hub -> boiler) add ot_gateway.
# Hardware: an OpenTherm MASTER adapter (e.g. OpenTherm Adapter, DIYLess Master OpenTherm Shield) on two GPIOs. NOT the
# RS485 unit: OpenTherm is a 2-wire current / voltage loop.
# Boiler terminals (see the Dominus knowledge base): 41 / 44 = IMG BUS (VICTRIX ZEUS 25, EXA, TERA, OMNIA, ZEUS Superior
# 26 / 32; 42 / 43 there are the Super CAR terminals). Without the CAR V2 the jumper X40 goes back on 40-41.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

substitutions:
  ot_project_version: "1.3.0"
  ot_name_prefix: "Immergas OT"
  # master adapter (towards the boiler): default an ATOMIC ToUnit Base under the AtomS3 Lite, DIP 2 = IO2 = G6 (white,
  # in), DIP 5 = IO1 = G5 (yellow, out); the shields' 3.3 V comes from G1 of the Grove AtomS3 (ot_3v3_supply)
  ot_boiler_in_pin: GPIO6
  ot_boiler_out_pin: GPIO5
  # 0xCA = the "Immergas fix" in the status request (without it some boilers ignore Data-ID 1 / 57); 0x00 = plain
  ot_status_low_byte: "0xCA"
  # true = the max. CH setpoint (57) is written with the CH setpoint (1), same value, as the original Immergas room
  # unit does (some boilers heat to 57 and ignore 1); the "max. CH setpoint" number then caps the CH setpoint
  ot_max_ch_follows_setpoint: "true"
  # CH flow setpoint sent while CH is off (some boilers keep heating to the last setpoint with the CH bit cleared);
  # 0 = keep sending the normal setpoint
  ot_ch_off_setpoint: "10"

external_components:
  - source: github://jotuera/immergas-modbus-bms-nasa-opentherm-hub@main
    components: [immergas_ot, immergas_core]

# shared helpers: the Immergas fault texts (11 languages) for "Fault (description)"
immergas_core:

immergas_ot:
  id: ot_hub
  mode: master
  status_low_byte: ${ot_status_low_byte}
  max_ch_follows_setpoint: ${ot_max_ch_follows_setpoint}
  ch_off_setpoint: ${ot_ch_off_setpoint}
  boiler:
    in_pin: ${ot_boiler_in_pin}
    out_pin: ${ot_boiler_out_pin}

# wall clock for ot_stats (midnight) and ot_programs (schedules): Home Assistant time
time:
  - platform: homeassistant
    id: ot_time

text_sensor:
  # Data-ID map for the cards: 64 hex characters = 256 bits (which IDs the boiler answers / does not know)
  - { platform: immergas_ot, type: ids_supported, name: "${n_ot_ids_supported}", id: ot_ids_supported, entity_category: diagnostic, icon: "mdi:format-list-checks" }
  - { platform: immergas_ot, type: ids_unknown, name: "${n_ot_ids_unknown}", id: ot_ids_unknown, entity_category: diagnostic, icon: "mdi:help-rhombus-outline" }

binary_sensor:
  - platform: immergas_ot
    type: state
    state: boiler_online
    name: "${n_ot_boiler_online}"
    id: ot_boiler_online
    device_class: connectivity
    entity_category: diagnostic

sensor:
  - platform: immergas_ot
    type: stat
    stat: frames
    name: "${n_ot_frames}"
    id: ot_frames
    entity_category: diagnostic
    disabled_by_default: true
  - platform: immergas_ot
    type: stat
    stat: errors
    name: "${n_ot_errors}"
    id: ot_errors
    entity_category: diagnostic
  - platform: immergas_ot
    type: stat
    stat: timeouts
    name: "${n_ot_timeouts}"
    id: ot_timeouts
    entity_category: diagnostic
