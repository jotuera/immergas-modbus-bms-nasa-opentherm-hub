# Immergas OpenTherm - package "ot_regulator" (master mode, optional)
# The regulator the room unit / Dominus module would be: every minute the CH flow setpoint (Data-ID 1) from a weather
# curve (two points, like the Immergas P66 / R curves) plus a slow room correction, and CH on / off by the room
# temperature with a hysteresis. Changes are slow on purpose: a fast PID overshoots on these boilers (full output, then
# the room stays too warm for hours).
# Room temperature: a Home Assistant sensor (substitution ot_room_entity, e.g. sensor.living_room_temperature).
# It can be a helper of Home Assistant that averages several rooms. Without a room temperature - also when the link to
# Home Assistant has been down for 2 minutes, because the last value would otherwise stay for ever - the regulator runs
# on the curve only (like a boiler with P66 and no thermostat).
# Optional integral term (default 0 = off): when the curve is a bit too low or too high it moves the flow slowly until
# the room reaches its target. It learns only close to the target with the boiler heating for CH, stops at the flow
# limits and keeps its value over the pauses between heating periods. It is not stored over a restart.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

substitutions:
  ot_room_entity: sensor.ot_room_temperature_not_set

globals:
  - { id: ot_room_int, type: float, initial_value: "0" }         # integral part of the room correction, °C of flow
  - { id: ot_ha_seen_ms, type: uint32_t, initial_value: "0" }    # when the Home Assistant link was last up

sensor:
  - platform: homeassistant
    id: ot_room_temp
    entity_id: ${ot_room_entity}
    internal: true
  - platform: template
    name: "${n_ot_room_int_now}"
    id: ot_room_int_now
    icon: mdi:sigma
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: 'return id(ot_room_int);'

text_sensor:
  - platform: template
    name: "${n_ot_reg_source}"
    id: ot_reg_source
    icon: mdi:chart-timeline-variant
    entity_category: diagnostic
    update_interval: never

switch:
  - platform: template
    name: "${n_ot_regulator}"
    id: ot_regulator
    icon: mdi:chart-bell-curve-cumulative
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_off:   # without the regulator the mode alone allows CH
      - lambda: 'id(ot_reg_demand) = true; id(ot_room_int) = 0;'
      - script.execute: ot_apply_flags

number:
  - { platform: template, name: "${n_ot_room_target}", id: ot_room_target, icon: "mdi:home-thermometer", unit_of_measurement: "°C", min_value: 10, max_value: 28, step: 0.5, initial_value: 21, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_ot_curve_outdoor_cold}", id: ot_curve_outdoor_cold, entity_category: config, unit_of_measurement: "°C", min_value: -25, max_value: 0, step: 1, initial_value: -15, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_ot_curve_flow_cold}", id: ot_curve_flow_cold, entity_category: config, unit_of_measurement: "°C", min_value: 25, max_value: 85, step: 1, initial_value: 60, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_ot_curve_outdoor_warm}", id: ot_curve_outdoor_warm, entity_category: config, unit_of_measurement: "°C", min_value: 5, max_value: 25, step: 1, initial_value: 18, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_ot_curve_flow_warm}", id: ot_curve_flow_warm, entity_category: config, unit_of_measurement: "°C", min_value: 20, max_value: 60, step: 1, initial_value: 30, restore_value: true, optimistic: true, mode: box }
  # flow °C per °C of room error (0 = curve only)
  - { platform: template, name: "${n_ot_room_gain}", id: ot_room_gain, entity_category: config, min_value: 0, max_value: 10, step: 0.5, initial_value: 3, restore_value: true, optimistic: true, mode: box }
  # flow °C added per hour for each °C of room error (0 = off)
  - { platform: template, name: "${n_ot_room_integral}", id: ot_room_integral, entity_category: config, min_value: 0, max_value: 5, step: 0.1, initial_value: 0, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_ot_room_hysteresis}", id: ot_room_hysteresis, entity_category: config, unit_of_measurement: "K", min_value: 0.1, max_value: 2, step: 0.1, initial_value: 0.3, restore_value: true, optimistic: true, mode: box }

interval:
  - interval: 60s
    then:
      - lambda: |-
          auto say = [](const std::string &v) {
            if (!id(ot_reg_source).has_state() || id(ot_reg_source).state != v) id(ot_reg_source).publish_state(v);
          };
          if (!id(ot_regulator).state) { say("${t_ot_reg_off}"); return; }
          uint32_t ms = millis();
          if (api::global_api_server != nullptr && api::global_api_server->is_connected()) id(ot_ha_seen_ms) = ms;
          bool ha_lost = ms - id(ot_ha_seen_ms) > 120000;
          // a sensor of Home Assistant keeps its last value when the link goes
          float room = ha_lost ? NAN : id(ot_room_temp).state;
          say(ha_lost ? "${t_ot_reg_no_ha}" : (isnan(room) ? "${t_ot_reg_no_room}" : "${t_ot_reg_room}"));
          // the curve between its two points
          float out = id(ot_outdoor_temp).state;
          float cold_o = id(ot_curve_outdoor_cold).state, warm_o = id(ot_curve_outdoor_warm).state;
          float cold_f = id(ot_curve_flow_cold).state, warm_f = id(ot_curve_flow_warm).state;
          float flow = (cold_f + warm_f) / 2;               // no outdoor probe: the middle of the curve
          if (!isnan(out)) {
            float pos = warm_o > cold_o ? (out - cold_o) / (warm_o - cold_o) : 0;
            flow = cold_f + (warm_f - cold_f) * clamp(pos, 0.0f, 1.0f);
          }
          // the limits: the boiler's (Data-ID 49) and the hub's max. CH setpoint
          float lo = isnan(id(ot_ch_min).state) ? 20 : id(ot_ch_min).state;
          float hi = isnan(id(ot_ch_max).state) ? 80 : id(ot_ch_max).state;
          if (!isnan(id(ot_max_ch_setpoint).state) && id(ot_max_ch_setpoint).state < hi) hi = id(ot_max_ch_setpoint).state;
          float target = id(ot_room_target).state, hyst = id(ot_room_hysteresis).state;
          float err = isnan(room) ? 0 : target - room;
          bool ch = id(ot_reg_demand);
          if (isnan(room)) ch = true;                       // the curve only
          else if (room >= target + hyst) ch = false;       // warm enough: no heat demand
          else if (room <= target - hyst) ch = true;        // too cold: heat demand
          float rate = id(ot_room_integral).state;
          if (rate <= 0) id(ot_room_int) = 0;
          flow += id(ot_room_gain).state * err + id(ot_room_int);
          // integral: near the target, while heating for CH, and never further into a limit
          if (rate > 0 && !isnan(room) && ch && id(ot_ch_enable).state && !id(ot_dhw_active).state && fabsf(err) <= 1.0f &&
              !(err > 0 && flow >= hi) && !(err < 0 && flow <= lo)) {
            id(ot_room_int) = clamp(id(ot_room_int) + rate * err / 60.0f, -10.0f, 10.0f);
          }
          flow = roundf(clamp(flow, lo, hi) * 2) / 2;
          if (ch != id(ot_reg_demand)) {
            id(ot_reg_demand) = ch;
            id(ot_apply_flags).execute();                   // CH enable = the mode allows CH and the room wants heat
          }
          if (fabsf(id(ot_ch_setpoint).state - flow) >= 0.5f) {
            auto call = id(ot_ch_setpoint).make_call();
            call.set_value(flow);
            call.perform();
          }
          ESP_LOGD("ot_regulator", "outdoor %.1f room %.1f / %.1f -> CH %s, flow %.1f (integral %.1f)", out, room, target, ch ? "on" : "off", flow, id(ot_room_int));
