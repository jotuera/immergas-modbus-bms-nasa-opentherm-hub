# Immergas gas boiler BMS - package "gb_mtop_calc" (optional, with gb_mtop; INSTEAD of gb_computed / gb_analytics - the heat pump has no burner): MAGIS M TOP
# Computed in the hub from this model's extra registers: delta T, mean loop temperature, the heat output measured from the system flow and the heat today, the system pressure
# drop over 24 h with a possible leak warning, the heat pump time today, defrosts today and the operating state.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

substitutions:
  # pressure drop over 24 h that raises the possible leak warning, bar
  gb_leak_bar_day: "0.2"

globals:
  - { id: gb_p_hist, type: "std::vector<float>" }
  - { id: gb_p_tick, type: int, initial_value: "0" }
  - { id: gb_mt_doy, type: int, restore_value: true, initial_value: "-1" }
  - { id: gb_mt_hp_s, type: float, restore_value: true, initial_value: "0" }
  - { id: gb_mt_q, type: float, restore_value: true, initial_value: "0" }
  - { id: gb_mt_def, type: int, restore_value: true, initial_value: "0" }
  - { id: gb_mt_def_was, type: bool, initial_value: "false" }

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool hp = id(gb_hp_active).state, def = id(gb_defrost).state;
          if (hp) id(gb_mt_hp_s) += 1;
          if (def && !id(gb_mt_def_was)) id(gb_mt_def)++;
          id(gb_mt_def_was) = def;
          // heat measured from the system flow (l/h) x 4.186 x delta T
          float q = id(gb_system_flow).state, f = id(gb_flow_temp).state, r = id(gb_return_temp).state;
          float kw = std::isnan(q) || std::isnan(f) || std::isnan(r) ? NAN : q / 3600.0f * 4.186f * (f - r);
          if (hp && !std::isnan(kw)) id(gb_mt_q) += fabsf(kw) / 3600.0f;
  - interval: 30s
    then:
      - lambda: |-
          auto now = id(gb_time).now();
          if (now.is_valid() && id(gb_mt_doy) != now.day_of_year) { id(gb_mt_doy) = now.day_of_year; id(gb_mt_hp_s) = 0; id(gb_mt_q) = 0; id(gb_mt_def) = 0; }
          id(gb_hp_hours_today).publish_state(id(gb_mt_hp_s) / 3600.0f);
          id(gb_defrosts_today).publish_state(id(gb_mt_def));
          id(gb_heat_today).publish_state(id(gb_mt_q));

sensor:
  - platform: template
    name: "${n_gb_pressure_drop}"
    id: gb_pressure_drop
    icon: mdi:gauge-low
    unit_of_measurement: "bar"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // a sample every 60 minutes; the drop = the oldest of the last 24 h minus now
      float p = id(gb_pressure).state;
      auto &v = id(gb_p_hist);
      if (!std::isnan(p) && (v.empty() || ++id(gb_p_tick) >= 60)) { id(gb_p_tick) = 0; v.push_back(p); if (v.size() > 25) v.erase(v.begin()); }
      if (v.size() < 2 || std::isnan(p)) return NAN;
      return v.front() - p;
  - { platform: template, name: "${n_gb_hp_hours_today}", id: gb_hp_hours_today, icon: "mdi:heat-pump", unit_of_measurement: "h", state_class: measurement, accuracy_decimals: 2 }
  - { platform: template, name: "${n_gb_defrosts_today}", id: gb_defrosts_today, icon: "mdi:snowflake-melt", state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "${n_gb_heat_today}", id: gb_heat_today, icon: "mdi:fire", unit_of_measurement: "kWh", device_class: energy, accuracy_decimals: 2 }
  - platform: template
    name: "${n_gb_heat_meas}"
    id: gb_heat_meas
    icon: mdi:radiator
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float q = id(gb_system_flow).state, f = id(gb_flow_temp).state, r = id(gb_return_temp).state;
      return std::isnan(q) || std::isnan(f) || std::isnan(r) ? NAN : q / 3600.0f * 4.186f * (f - r);
  - platform: template
    name: "${n_gb_delta_t}"
    id: gb_delta_t
    icon: mdi:delta
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float f = id(gb_flow_temp).state, r = id(gb_return_temp).state;
      return std::isnan(f) || std::isnan(r) ? NAN : f - r;
  - platform: template
    name: "${n_gb_mean_loop}"
    id: gb_mean_loop
    icon: mdi:approximately-equal
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float f = id(gb_flow_temp).state, r = id(gb_return_temp).state;
      return std::isnan(f) || std::isnan(r) ? NAN : (f + r) / 2.0f;

binary_sensor:
  - platform: template
    name: "${n_gb_leak_warning}"
    id: gb_leak_warning
    device_class: problem
    lambda: |-
      float d = id(gb_pressure_drop).state;
      return !std::isnan(d) && d >= ${gb_leak_bar_day};

text_sensor:
  - platform: template
    name: "${n_gb_op_state}"
    id: gb_op_state
    icon: mdi:state-machine
    update_interval: 10s
    lambda: |-
      int code = std::isnan(id(gb_fault_code).state) ? 0 : (int) id(gb_fault_code).state;
      char b[48];
      if (id(gb_fault_locked).state) { snprintf(b, sizeof(b), "${t_gb_st_fault} %d – ${t_gb_st_locked}", code); return std::string(b); }
      if (id(gb_fault_resettable).state || code > 0) { snprintf(b, sizeof(b), "${t_gb_st_fault} %d (${t_gb_st_resettable})", code); return std::string(b); }
      if (id(gb_defrost).state) return std::string("${t_gb_st_defrost}");
      if (id(gb_antifreeze_active).state) return std::string("${t_gb_st_antifreeze}");
      if (id(gb_hp_active).state) {
        std::string s = id(gb_mtop_cooling) ? "${t_gb_st_hp_cool}" : "${t_gb_st_hp_heat}";
        if (id(gb_pump_dhw).state) s += " · ${t_gb_st_dhw}";
        return s;
      }
      return std::string("${t_gb_st_idle}");
