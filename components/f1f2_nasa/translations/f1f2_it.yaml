# Etichette delle classi di indirizzo dispositivo nell'elenco "NASA dispositivi"
device_classes:
  0x10: unità esterna
  0x11: unità idronica (HTU)
  0x20: unità interna
  0x50: comando remoto cablato
  0x58: modulo PIM
  0x59: modulo SIM
  0x62: kit Wi-Fi
  0x63: modulo MIM
  0x65: controllore centrale
  0x6A: DMS
  0x80: strumento di servizio

