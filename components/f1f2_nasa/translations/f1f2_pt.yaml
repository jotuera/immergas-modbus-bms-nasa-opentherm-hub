# Etiquetas das classes de endereços na lista "NASA dispositivos"
device_classes:
  0x10: unidade exterior
  0x11: módulo hidráulico (HTU)
  0x20: unidade interior
  0x50: comando com fios
  0x58: módulo PIM
  0x59: módulo SIM
  0x62: kit Wi-Fi
  0x63: módulo MIM
  0x65: controlador central
  0x6A: DMS
  0x80: ferramenta de serviço

