# Etiquetas de las clases de dirección de dispositivo en la lista "NASA dispositivos"
device_classes:
  0x10: unidad exterior
  0x11: unidad hidráulica (HTU)
  0x20: unidad interior
  0x50: mando cableado
  0x58: módulo PIM
  0x59: módulo SIM
  0x62: kit Wi-Fi
  0x63: módulo MIM
  0x65: controlador central
  0x6A: DMS
  0x80: herramienta de servicio

