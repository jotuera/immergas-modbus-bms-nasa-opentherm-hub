y1="235" x2="840" y2="235" stroke="#e8590c" stroke-width="3"/><line x1="730" y1="263" x2="840" y2="263" stroke="#1c7ed6" stroke-width="3"/><circle cx="730" cy="235" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><circle cx="730" cy="263" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><line x1="765" y1="235" x2="765" y2="242" stroke="#2b8a3e" stroke-width="2.5" stroke-dasharray="3 2"/><line x1="765" y1="256" x2="765" y2="263" stroke="#2b8a3e" stroke-width="2.5" stroke-dasharray="3 2"/><rect x="758" y="242" width="14" height="14" rx="3" fill="#fff" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="3 2"/><text x="765" y="223" text-anchor="middle" font-weight="700" font-size="12" fill="#2b8a3e">120 Ω (długi kabel)</text><rect x="820" y="95" width="590" height="470" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text x="1115" y="123" text-anchor="middle" font-weight="700" font-size="16">Kocioł Immergas – port BMS</text><text x="1115" y="142" text-anchor="middle" font-size="12" fill="#495057">Modbus RTU · kocioł = slave 1 · hub = master</text><rect x="840" y="216" width="170" height="62" rx="6" fill="#dee2e6" stroke="#495057"/><circle cx="852" cy="235" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="865" y="240" font-weight="700" font-size="13" fill="#e8590c">D+ · T+ · BMS+</text><circle cx="852" cy="263" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><text x="865" y="268" font-weight="700" font-size="13" fill="#1c7ed6">D− · T− · BMS−</text><text x="840" y="340" font-size="12" font-weight="700" fill="#495057">kocioł</text><text x="1120" y="340" font-size="12" font-weight="700" fill="#495057">zaciski</text><text x="1250" y="340" font-size="12" font-weight="700" fill="#495057">menu</text><line x1="840" y1="348" x2="1390" y2="348" stroke="#ced4da"/><text x="840" y="372" font-size="12.5">VICTRIX SUPERIOR 2021, ZEUS Superior 25–35</text><text x="1120" y="372" font-size="12.5" font-weight="700">D+ / D−</text><text x="1250" y="372" font-size="12" fill="#495057">Typ = Bms</text><text x="840" y="410" font-size="12.5">VICTRIX EXTRA</text><text x="1120" y="410" font-size="12.5" font-weight="700">D+ / D−</text><text x="1250" y="410" font-size="12" fill="#495057">P.18 = 2, P.11 = 1</text><text x="840" y="448" font-size="12.5">VICTRIX PRO V2 EU</text><text x="1120" y="448" font-size="12.5" font-weight="700">T+ / T− (A38)</text><text x="1250" y="448" font-size="12" fill="#495057">X40 zdjęta</text><text x="840" y="486" font-size="12.5">MAGIS M TOP (E-BOX TOP)</text><text x="1120" y="486" font-size="12.5" font-weight="700">BMS+ / BMS−</text><text x="1250" y="486" font-size="12" fill="#495057">P021 – P024</text><text x="840" y="524" font-size="12.5">kotły IMG-BUS przez IU23 (hipoteza)</text><text x="1120" y="524" font-size="12.5" font-weight="700">IU23 A / B</text><text x="1250" y="524" font-size="12" fill="#495057">IU23 na 44 / 41, 8N2</text><text x="40" y="610" font-size="14" font-weight="600" xml:space="preserve">A ← D+ · T+ · BMS+      B ← D− · T− · BMS−      (cisza na magistrali → zamień A i B)</text><text x="40" y="636" font-size="14"><tspan fill="#2b8a3e" font-weight="700">●</tspan> 120 Ω po stronie huba tylko przy długim kablu; PRO V2 EU: mostek TRD – T− w kotle; MAGIS M TOP: dip switch SW1.2.</text><text x="40" y="662" font-size="14"><tspan fill="#e03131" font-weight="700">●</tspan> Bez Dominusa, CAR V2, termostatu pokojowego i DIM na tej magistrali: menu kotła Modbus / Typ = Dominus ALBO BMS.</text><text x="40" y="688" font-size="14"><tspan fill="#adb5bd" font-weight="700">●</tspan> Port 9600, 8E1, adres slave 1 (IU23: 8N2, adres 21–36). Zasilaj hub z własnej ładowarki USB.</text></svg>