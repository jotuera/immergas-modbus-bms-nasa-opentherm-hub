<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 700" width="1290" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#212529"><title>MAGIS M (Midea M-Thermal) – wiring of the hub</title><rect width="1290" height="700" rx="16" fill="#ffffff"/><text x="40" y="48" font-size="22" font-weight="700">MAGIS M (Midea M-Thermal) – wiring of the hub</text><text x="40" y="490" font-size="13" fill="#495057">↑ USB-C 5 V from a separate wall charger</text><rect x="100" y="308" width="50" height="22" rx="6" fill="#868e96"/><rect x="70" y="330" width="200" height="130" rx="14" fill="#343a40"/><rect x="150" y="360" width="40" height="40" rx="4" fill="#495057"/><text x="170" y="422" text-anchor="middle" fill="#fff" font-weight="600">M5Stack AtomS3 Lite</text><text x="170" y="440" text-anchor="middle" fill="#ced4da" font-size="12">ESP32-S3 · no PortABC</text><rect x="178" y="312" width="64" height="20" rx="4" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/><text x="210" y="326" text-anchor="middle" font-size="11" font-weight="700">Grove</text><polyline points="196,312 196,244 540,244" fill="none" stroke="#f59f00" stroke-width="4"/><polyline points="224,312 224,254 540,254" fill="none" stroke="#868e96" stroke-width="6"/><polyline points="224,312 224,254 540,254" fill="none" stroke="#ffffff" stroke-width="3"/><text x="260" y="226" font-size="12" fill="#495057">Grove AtomS3 · RX G1 · TX G2</text><text x="260" y="278" font-size="12" fill="#495057">Grove: white = ESP RX, yellow = ESP TX</text><text x="260" y="294" font-size="12" fill="#868e96">with a PortABC: port C, RX G6 · TX G5</text><rect x="540" y="198" width="190" height="112" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/><text x="625" y="254" text-anchor="middle" font-weight="600">Isolated RS485 Unit</text><text x="712" y="240" text-anchor="middle" font-weight="700" fill="#e8590c">A</text><text x="712" y="268" text-anchor="middle" font-weight="700" fill="#1c7ed6">B</text><line x1="730" y1="235" x2="840" y2="235" stroke="#e8590c" stroke-width="3"/><line x1="730" y1="263" x2="840" y2="263" stroke="#1c7ed6" stroke-width="3"/><circle cx="730" cy="235" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><circle cx="730" cy="263" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><line x1="765" y1="235" x2="765" y2="242" stroke="#2b8a3e" stroke-width="2.5" stroke-dasharray="3 2"/><line x1="765" y1="256" x2="765" y2="263" stroke="#2b8a3e" stroke-width="2.5" stroke-dasharray="3 2"/><rect x="758" y="242" width="14" height="14" rx="3" fill="#fff" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="3 2"/><text x="765" y="223" text-anchor="middle" font-weight="700" font-size="12" fill="#2b8a3e">120 Ω (if needed)</text><text x="702" y="296" text-anchor="middle" font-weight="700" fill="#212529">GND</text><line x1="730" y1="291" x2="840" y2="291" stroke="#212529" stroke-width="3"/><circle cx="730" cy="291" r="6" fill="#fff" stroke="#212529" stroke-width="2.5"/><rect x="820" y="95" width="440" height="470" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text x="1040" y="123" text-anchor="middle" font-weight="700" font-size="16">MAGIS M wired controller</text><text x="1040" y="142" text-anchor="middle" font-size="12" fill="#495057">terminal block on the back · controller = slave 1</text><rect x="840" y="216" width="52" height="90" rx="6" fill="#dee2e6" stroke="#495057"/><circle cx="852" cy="235" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="865" y="240" font-weight="700" font-size="13" fill="#e8590c">H1</text><circle cx="852" cy="263" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><text x="865" y="268" font-weight="700" font-size="13" fill="#1c7ed6">H2</text><circle cx="852" cy="291" r="6" fill="#fff" stroke="#212529" stroke-width="2.5"/><text x="865" y="296" font-weight="700" font-size="13">E</text><text x="907" y="240" font-weight="700" font-size="13">H1 / H2 · Modbus 9600 8N1</text><text x="907" y="268" font-size="12" fill="#495057">hub = master, only one master</text><text x="907" y="296" font-size="12" fill="#495057">E · reference (GND)</text><rect x="840" y="381" width="52" height="62" rx="6" fill="#f8f9fa" stroke="#adb5bd"/><text x="853" y="405" font-weight="700" font-size="13" fill="#adb5bd">A</text><text x="853" y="433" font-weight="700" font-size="13" fill="#adb5bd">B</text><line x1="835" y1="386" x2="897" y2="438" stroke="#e03131" stroke-width="3"/><line x1="897" y1="386" x2="835" y2="438" stroke="#e03131" stroke-width="3"/><text x="907" y="419" font-size="12.5" font-weight="700" fill="#e03131">A / B – 13.5 V AC supply: NEVER</text><rect x="840" y="461" width="52" height="62" rx="6" fill="#f8f9fa" stroke="#adb5bd"/><text x="853" y="485" font-weight="700" font-size="13" fill="#adb5bd">X</text><text x="853" y="513" font-weight="700" font-size="13" fill="#adb5bd">Y</text><line x1="835" y1="466" x2="897" y2="518" stroke="#e03131" stroke-width="3"/><line x1="897" y1="466" x2="835" y2="518" stroke="#e03131" stroke-width="3"/><text x="907" y="499" font-size="12.5" font-weight="700" fill="#e03131">X / Y – controller ↔ hydro module: NEVER</text><text x="40" y="610" font-size="14" font-weight="600" xml:space="preserve">A ← H1      B ← H2      sources disagree which is A+: nothing answers → swap H1 and H2</text><text x="40" y="636" font-size="14"><tspan fill="#495057" font-weight="700">●</tspan> GND of the RS485 unit → E. Never touch A / B (controller supply) or X / Y (internal bus).</text><text x="40" y="662" font-size="14"><tspan fill="#e03131" font-weight="700">●</tspan> The controller must stay connected – it serves the registers; address: FOR SERVICEMAN → 17 HMI ADDRESS = 1.</text><text x="40" y="688" font-size="14"><tspan fill="#2b8a3e" font-weight="700">●</tspan> 120 Ω between H1 and H2 only if the bus shows errors. Power the hub from its own USB charger.</text></svg>