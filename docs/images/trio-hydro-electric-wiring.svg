<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 750" width="1210" height="750" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#212529"><title>TRIO HYDRO ELECTRIC – podłączenie huba do dwóch magistral RS485</title><rect width="1210" height="750" rx="16" fill="#ffffff"/><text x="40" y="48" font-size="22" font-weight="700">TRIO HYDRO ELECTRIC – podłączenie huba do dwóch magistral RS485</text><rect x="135" y="122" width="50" height="22" rx="6" fill="#868e96"/><text x="160" y="108" text-anchor="middle" font-size="13" fill="#495057">USB-C 5 V z osobnej ładowarki</text><rect x="70" y="144" width="180" height="110" rx="14" fill="#343a40"/><rect x="140" y="170" width="40" height="40" rx="4" fill="#495057"/><text x="160" y="232" text-anchor="middle" fill="#fff" font-weight="600">M5Stack AtomS3 Lite</text><text x="160" y="248" text-anchor="middle" fill="#ced4da" font-size="12">ESP32-S3</text><rect x="40" y="262" width="250" height="360" rx="12" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="165" y="288" text-anchor="middle" font-weight="600" fill="#495057">Podstawka ATOMIC PortABC</text><text x="300" y="270" font-size="12" fill="#495057">Grove: biały = RX ESP, żółty = TX ESP</text><text x="60" y="326" font-weight="700" font-size="16" fill="#e03131">Port A</text><text x="60" y="346" font-size="12" fill="#495057">RX G39 · TX G38</text><rect x="262" y="310" width="40" height="40" rx="5" fill="#e03131" stroke="#212529"/><rect x="272" y="320" width="20" height="20" rx="3" fill="#f8f9fa" opacity="0.85"/><line x1="302" y1="325" x2="440" y2="325" stroke="#f59f00" stroke-width="4"/><line x1="302" y1="335" x2="440" y2="335" stroke="#868e96" stroke-width="6"/><line x1="302" y1="335" x2="440" y2="335" stroke="#ffffff" stroke-width="3"/><rect x="440" y="282" width="190" height="96" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/><text x="525" y="338" text-anchor="middle" font-weight="600">Isolated RS485 Unit</text><text x="612" y="324" text-anchor="middle" font-weight="700" fill="#e8590c">A</text><text x="612" y="352" text-anchor="middle" font-weight="700" fill="#1c7ed6">B</text><line x1="630" y1="319" x2="745" y2="319" stroke="#e8590c" stroke-width="3"/><line x1="630" y1="347" x2="745" y2="347" stroke="#1c7ed6" stroke-width="3"/><circle cx="630" cy="319" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><circle cx="630" cy="347" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><line x1="650" y1="319" x2="650" y2="326" stroke="#2b8a3e" stroke-width="2.5"/><line x1="650" y1="340" x2="650" y2="347" stroke="#2b8a3e" stroke-width="2.5"/><rect x="643" y="326" width="14" height="14" rx="3" fill="#2b8a3e"/><circle cx="650" cy="319" r="3.5" fill="#2b8a3e"/><circle cx="650" cy="347" r="3.5" fill="#2b8a3e"/><text x="664" y="338" font-weight="700" font-size="13" fill="#2b8a3e">120 Ω</text><text x="60" y="446" font-weight="700" font-size="16" fill="#212529">Port B</text><text x="60" y="466" font-size="12" fill="#495057">RX G8 · TX G7</text><rect x="262" y="430" width="40" height="40" rx="5" fill="#212529" stroke="#212529"/><rect x="272" y="440" width="20" height="20" rx="3" fill="#f8f9fa" opacity="0.85"/><line x1="302" y1="445" x2="440" y2="445" stroke="#f59f00" stroke-width="4"/><line x1="302" y1="455" x2="440" y2="455" stroke="#868e96" stroke-width="6"/><line x1="302" y1="455" x2="440" y2="455" stroke="#ffffff" stroke-width="3"/><rect x="440" y="402" width="190" height="96" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/><text x="525" y="458" text-anchor="middle" font-weight="600">Isolated RS485 Unit</text><text x="612" y="444" text-anchor="middle" font-weight="700" fill="#e8590c">A</text><text x="612" y="472" text-anchor="middle" font-weight="700" fill="#1c7ed6">B</text><line x1="630" y1="439" x2="745" y2="439" stroke="#e8590c" stroke-width="3"/><line x1="630" y1="467" x2="745" y2="467" stroke="#1c7ed6" stroke-width="3"/><circle cx="630" cy="439" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><circle cx="630" cy="467" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><text x="642" y="490" font-size="12" fill="#868e96">bez rezystora</text><text x="60" y="566" font-weight="700" font-size="16" fill="#1971c2">Port C</text><text x="60" y="586" font-size="12" fill="#495057">RX G6 · TX G5</text><rect x="262" y="550" width="40" height="40" rx="5" fill="#1971c2" stroke="#212529"/><rect x="272" y="560" width="20" height="20" rx="3" fill="#f8f9fa" opacity="0.85"/><text x="320" y="568" font-size="13" font-weight="600" fill="#868e96">wolny</text><text x="320" y="585" font-size="12" fill="#adb5bd">(później trzecia magistrala)</text><rect x="725" y="220" width="360" height="320" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text x="905" y="248" text-anchor="middle" font-weight="700" font-size="16">Jednostka wewnętrzna TRIO HYDRO</text><text x="905" y="267" text-anchor="middle" font-size="12" fill="#495057">zaciski magistral</text><rect x="745" y="300" width="52" height="62" rx="6" fill="#dee2e6" stroke="#495057"/><circle cx="757" cy="319" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="770" y="324" font-weight="700" font-size="13" fill="#e8590c">A</text><circle cx="757" cy="347" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><text x="770" y="352" font-weight="700" font-size="13" fill="#1c7ed6">B</text><text x="810" y="316" font-weight="700" font-size="13">Magistrala strefowa · Modbus 9600 8E1</text><text x="810" y="334" font-size="12" fill="#495057">jedn. wewn. = master · panel strefy 41 / 42</text><text x="810" y="351" font-size="12" fill="#495057">hub słucha (emulacja wyłączona)</text><rect x="745" y="420" width="52" height="62" rx="6" fill="#dee2e6" stroke="#495057"/><circle cx="757" cy="439" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="770" y="444" font-weight="700" font-size="13" fill="#e8590c">F1</text><circle cx="757" cy="467" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/><text x="770" y="472" font-weight="700" font-size="13" fill="#1c7ed6">F2</text><text x="810" y="436" font-weight="700" font-size="13">F1/F2 · Samsung NASA 8E1</text><text x="810" y="454" font-size="12" fill="#495057">linia do jednostki zewn. (płytka A22)</text><text x="810" y="471" font-size="12" fill="#495057">hub słucha równolegle</text><line x1="1085" y1="439" x2="1105" y2="439" stroke="#e8590c" stroke-width="3"/><line x1="1085" y1="467" x2="1105" y2="467" stroke="#1c7ed6" stroke-width="3"/><rect x="1105" y="400" width="80" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="1145" y="432" text-anchor="middle" font-size="12" font-weight="600">Jednostka</text><text x="1145" y="448" text-anchor="middle" font-size="12" font-weight="600">zewn.</text><text x="1145" y="480" text-anchor="middle" font-size="10" fill="#495057">UE HYDRO HP</text><text x="40" y="660" font-size="14" font-weight="600" xml:space="preserve">A ← A / D+ · F1      B ← B / D- · F2      (cisza na magistrali albo błędy CRC → zamień A i B)</text><text x="40" y="686" font-size="14"><tspan fill="#2b8a3e" font-weight="700">●</tspan> Rezystor 120 Ω w zaciskach A-B modułu magistrali strefowej, jak na D+/D- w MAGIS (tam bez niego E121).</text><text x="40" y="710" font-size="14"><tspan fill="#adb5bd" font-weight="700">●</tspan> F1/F2: bez rezystora, hub wpina się w środek linii.</text><text x="40" y="734" font-size="14"><tspan fill="#e03131" font-weight="700">●</tspan> Zasilaj hub z własnej ładowarki USB, nie z jednostki wewnętrznej: wspólne zasilanie może zakłócać masę magistral.</text></svg>